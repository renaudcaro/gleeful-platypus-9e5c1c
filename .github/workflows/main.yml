
name: Actualisation quotidienne Atlas

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  actualisation:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collecter les actualites
        env:
          PYTHONUNBUFFERED: '1'
        run: python collecte.py

      - name: Enregistrer les nouvelles actualites
        run: |
          if ! git diff --quiet -- actualites.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add actualites.json
            git commit -m "Actualisation automatique des actualites"
            git push
          else
            echo "Aucune nouvelle actualite"
          fi
          
